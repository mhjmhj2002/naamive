services:
  codex-smoke:
    build:
      context: ../../..
      dockerfile: naamive/tooling/codex-smoke/Dockerfile
    environment:
      HOME: /home/codex
      NAAMIVE_RUNTIME_CLI: naamive
      NAAMIVE_CODEX_COMMAND: /usr/local/bin/codex
      # This service runs only with the persisted session produced by the
      # companion `codex-login` service in the same isolated volume.
      NAAMIVE_CODEX_AUTH_VERIFIED: "true"
    cap_add:
      - SYS_ADMIN
    privileged: true
    security_opt:
      - seccomp:unconfined
    volumes:
      - ../../..:/work/naamive:rw
      - codex-smoke-state:/home/codex/.codex:rw
    working_dir: /work/naamive
    entrypoint: ["bash", "-lc"]
  codex-login:
    build:
      context: ../../..
      dockerfile: naamive/tooling/codex-smoke/Dockerfile
    environment:
      HOME: /home/codex
      NAAMIVE_RUNTIME_CLI: naamive
    network_mode: host
    volumes:
      - codex-smoke-state:/home/codex/.codex:rw
    working_dir: /work/naamive
    entrypoint: ["bash", "-lc"]

volumes:
  codex-smoke-state:
