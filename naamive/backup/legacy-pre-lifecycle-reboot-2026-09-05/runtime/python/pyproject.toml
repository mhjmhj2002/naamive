[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naamive-runtime"
version = "0.1.0"
description = "DEPRECATED legacy NAAMIVE Python orchestration runtime; retained only for Node migration reference"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 7 - Inactive",
]
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "typer>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
naamive = "naamive_runtime.cli:app"

[tool.pytest.ini_options]
testpaths = ["../../tests/runtime_python"]
