<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAAMIVE — Fase 1</title><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem}main{display:grid;grid-template-columns:1fr 2fr;gap:2rem}@media(max-width:700px){main{display:block}}label{display:block;margin-top:.6rem;font-weight:600}input,textarea{box-sizing:border-box;width:100%;padding:.5rem}button{margin:.8rem .4rem .8rem 0;padding:.5rem .8rem}pre{white-space:pre-wrap;background:#f5f5f5;padding:1rem}.card{border:1px solid #ddd;padding:1rem;margin:.5rem 0}.muted{color:#555}</style><h1>NAAMIVE</h1><p id="status" role="status">Crie uma necessidade de negócio vinculada a um clone Git local.</p><main><aside><h2>Projetos</h2><div id="projects"></div></aside><section><h2>Novo rascunho</h2><form id="intake"><label>Projeto<input name="project_id" required pattern="[a-z0-9]+(-[a-z0-9]+)*"></label><label>Clone Git local<input name="repository_path" required></label><label>Título<input name="title" required></label><label>Responsável de negócio<input name="business_owner" required></label><label>Problema de negócio<textarea name="business_problem" required></textarea></label><label>Resultado desejado<textarea name="desired_outcome" required></textarea></label><label>Métricas (uma por linha)<textarea name="success_metrics" required></textarea></label><label>Stakeholders (um por linha)<textarea name="stakeholders" required></textarea></label><label>Restrições conhecidas (uma por linha)<textarea name="known_constraints" required></textarea></label><label>Evidências e fontes (uma por linha)<textarea name="evidence_sources" required></textarea></label><label>Premissas (uma por linha)<textarea name="assumptions" required></textarea></label><label>Questões em aberto (uma por linha)<textarea name="open_questions" required></textarea></label><button>Criar rascunho</button><button type="button" id="submit">Submeter</button></form><section id="detail" hidden><h2>Detalhe</h2><div id="summary" class="card"></div><div id="decision" hidden class="card"><h3>Registrar projeto</h3><button id="approve">Aprovar registro</button><textarea id="feedback" placeholder="Feedback obrigatório ao rejeitar"></textarea><button id="reject">Rejeitar</button></div><h3>Timeline</h3><pre id="events" aria-live="polite"></pre></section></section></main><script>
const form=document.querySelector('#intake'),status=document.querySelector('#status'),events=document.querySelector('#events'),detail=document.querySelector('#detail'),summary=document.querySelector('#summary'),decision=document.querySelector('#decision');let projectId,gate,stream;
const listFields=['success_metrics','stakeholders','known_constraints','evidence_sources','assumptions','open_questions'];const value=fd=>Object.fromEntries([...fd.entries()].map(([k,v])=>[k,listFields.includes(k)?v.split('\n').map(x=>x.trim()).filter(Boolean):v.trim()]));
async function projects(){const r=await fetch('/api/projects'),b=await r.json();document.querySelector('#projects').innerHTML=b.items.map(p=>`<button data-id="${p.id}">${p.id}</button><div class="muted">${p.status||p.state} · ${p.next_action||''}</div>`).join('')||'<p>Nenhum projeto.</p>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openProject(x.dataset.id));}
function watch(id){stream?.close();stream=new EventSource(`/api/projects/${id}/events`);stream.onmessage=e=>events.textContent+=e.data+'\n';['PROJECT_CREATED','INTAKE_SUBMITTED','INTAKE_VALIDATED','INTAKE_REQUIRES_ADJUSTMENT','GATE_OPENED','PROJECT_REGISTERED','GATE_REJECTED'].forEach(t=>stream.addEventListener(t,e=>{events.textContent+=e.data+'\n';openProject(id)}));}
async function openProject(id){projectId=id;const r=await fetch(`/api/projects/${id}`),p=await r.json();if(!r.ok)return status.textContent=p.code;detail.hidden=false;gate=p.gate;summary.textContent=`${p.title}: ${p.status||p.state}. Próxima ação: ${p.next_action||'—'}`;decision.hidden=!gate;events.textContent='';watch(id);projects();}
form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(value(new FormData(form)))}),b=await r.json();if(!r.ok)return status.textContent=`${b.code}: ${b.message}`;status.textContent='Rascunho criado.';openProject(b.project_id)};
document.querySelector('#submit').onclick=async()=>{if(!projectId)return status.textContent='Crie ou selecione um rascunho primeiro.';const r=await fetch(`/api/projects/${projectId}/submit`,{method:'POST',headers:{'idempotency-key':crypto.randomUUID()}}),b=await r.json();status.textContent=r.ok?`Operação aceita: ${b.operation_id}`:`${b.code}: ${b.message}`;openProject(projectId)};
async function decide(decisionValue){if(!gate)return;const r=await fetch(`/api/projects/${projectId}/decision`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision:decisionValue,gate_id:gate.id,version:gate.version,feedback:document.querySelector('#feedback').value})}),b=await r.json();status.textContent=r.ok?`Projeto ${b.state}.`:`${b.code}: ${b.message}`;openProject(projectId)}document.querySelector('#approve').onclick=()=>decide('APPROVED');document.querySelector('#reject').onclick=()=>decide('REJECTED');projects();
</script></html>
